services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: props
      POSTGRES_PASSWORD: props
      POSTGRES_DB: props
    ports:
      - "54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U props"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
